# CI for @luoshuizhiwei/dsh-desktop-restart
#
# 测试、npm 发布与 GitHub Release 三个阶段。
#
# 1. test：每次 push / PR 跑完整离线检查；Windows 同时覆盖进程相关分支。
#
# 2. publish：推 v* 标签时发布到 npm。用 OIDC Trusted Publishing：
#    npm 侧登记「这个包归这个仓库」后，GitHub 向 npm 证明身份用的是短命的
#    OIDC 令牌（每次发布现换现用），本机与仓库里都不存任何 npm 令牌 ——
#    也就没有「令牌泄露」「三天过期」「发布前 OTP」这些事（2026-10-17~20
#    反复卡住的就是它们）。
#
#    发布任务使用 ubuntu-latest；测试矩阵与发布运行环境分别配置。
#
# 3. release：npm 发布成功后，给同一个标签建 GitHub Release（自动生成变更
#    说明）。**tag 只是提交上的书签，Releases 页读的是 Release 对象** ——
#    2026-10-20 之前只推 tag 没建 Release，于是 npm 到了 0.4.3、Releases
#    页却停在 v0.3.0。
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run offline tests
        run: npm test

  publish:
    # 只有打标签（v0.3.7 这类）才发布；普通提交只测试。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC：向 npm 证明「这次发布来自这个仓库」
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        run: node -e 'const p = require("./package.json"); const expected = "v" + p.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error("Expected tag " + expected + ", got " + process.env.GITHUB_REF_NAME); process.exit(1); }'

      # OIDC 需要 npm ≥ 11.5.1 与 Node ≥ 22.14（官方文档的要求）。
      # Node 24 自带的 npm 已满足；显式升到 latest 是保险，别让人猜捆绑版本。
      - name: Ensure npm supports OIDC (>= 11.5.1)
        run: npm install -g npm@latest

      # prepublishOnly（npm test）已由 CI 的 test job 三档矩阵把关，
      # 这里不再重复跑一遍 —— publish --ignore-scripts 会跳过它。
      # 不设 NODE_AUTH_TOKEN：npm ≥ 11.5.1 检测到 GitHub OIDC 环境会
      # 优先走短命令牌，占位反而多一种失败形态。
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --ignore-scripts

  release:
    # 排在 publish 之后：Release 一旦出现，就说明 npm 上确实已经有这个版本。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release 需要写仓库内容
    steps:
      - uses: actions/checkout@v4
        with:
          # --generate-notes 要靠完整历史找「上一个 tag」来划分变更范围。
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 正文用**标签注解**，不用 --generate-notes：本仓库直接提交到 master、
          # 几乎不建 PR，GitHub 自动生成的说明只有一行 Full Changelog（实测
          # v0.4.3 就是这样，等于没有说明）。
          #
          # 注解必须经 **API** 读（2026-10-20 v0.4.4 实测踩过）：actions/checkout
          # 检出 tag 时没取注解对象，本地那个 tag 变成轻量标签，
          # `git for-each-ref %(contents)` 会静默回落到**提交信息** —— 于是
          # Release 正文变成了最后一条 commit 的内容。
          tag="$GITHUB_REF_NAME"
          prev="$(git describe --tags --abbrev=0 "${tag}^")"
          kind="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.type)"
          if [ "$kind" = "tag" ]; then
            object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"
            note="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}" --jq .message)"
          else
            # 轻量标签没有注解，退回提交标题（总比空白好）。
            note="$(git log -1 --pretty=%s)"
          fi
          {
            printf '%s\n\n' "$note"
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$tag"
          } > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
